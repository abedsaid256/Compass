<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12161c">
<title>My Life — Compass</title>
<style>
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2028; --surface2:#212934; --text:#e9e4d8; --muted:#8d97a5;
  --line:#2a3340; --accent:#c99a4b; --accent-soft:rgba(201,154,75,.14);
  --build:#c99a4b; --live:#6fa08c; --rest:#8590c0;
  --st-neg:#c9705e; --st-att:#c99a4b; --st-ok:#8d97a5; --st-good:#6fa08c; --st-strong:#4fae8d;
  --danger:#c9705e; --shadow:0 8px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f5f2ea; --surface:#fffdf7; --surface2:#efeade; --text:#23272d; --muted:#6b7280;
  --line:#e3dccb; --accent:#9c7526; --accent-soft:rgba(156,117,38,.12);
  --build:#9c7526; --live:#4c7d6a; --rest:#5f6ba8;
  --st-neg:#b3543f; --st-att:#9c7526; --st-ok:#6b7280; --st-good:#4c7d6a; --st-strong:#2f8a68;
  --danger:#b3543f; --shadow:0 8px 24px rgba(80,70,50,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; font-size:16px; line-height:1.5;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom)); min-height:100vh;}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif; font-weight:600; letter-spacing:.2px;}
h1{font-size:26px; margin:0}
h2{font-size:19px; margin:0 0 10px}
h3{font-size:16px; margin:0}
p{margin:.4em 0}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600;}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.serif-i{font-family:Georgia,serif; font-style:italic;}
header{position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px; display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom:1px solid var(--line);}
.hdr-actions{display:flex; gap:6px}
.iconbtn{background:none; border:1px solid var(--line); color:var(--muted); border-radius:12px;
  width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:17px;}
.iconbtn:active{background:var(--surface2)}
main{padding:16px 16px 8px; max-width:560px; margin:0 auto;}
.screen{display:none}
.screen.active{display:block; animation:fadein .25s ease}
@keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
.card.flat{background:transparent; border-style:dashed}
.row{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.epigraph{font-family:Georgia,serif; font-style:italic; color:var(--muted); font-size:15px; margin:6px 0 16px;}
.needs-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.need-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px;}
.need-card .nm{font-family:Georgia,serif; font-size:14.5px; margin:6px 0 4px; font-weight:600;}
.need-card .last{font-size:11.5px; color:var(--muted); min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pill{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 8px; border-radius:99px; border:1px solid;}
.st-0{color:var(--st-neg); border-color:var(--st-neg)}
.st-1{color:var(--st-att); border-color:var(--st-att)}
.st-2{color:var(--st-ok); border-color:var(--st-ok)}
.st-3{color:var(--st-good); border-color:var(--st-good)}
.st-4{color:var(--st-strong); border-color:var(--st-strong)}
.dots{display:flex; gap:4px; margin:7px 0 6px;}
.dot{width:9px; height:9px; border-radius:99px; border:1.5px solid var(--line); background:transparent;}
.dot.d1{background:var(--accent); opacity:.35; border-color:transparent}
.dot.d2{background:var(--accent); opacity:.65; border-color:transparent}
.dot.d3{background:var(--accent); opacity:1; border-color:transparent}
.dot.da{border-color:var(--accent)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--accent); color:var(--bg);
  border:none; border-radius:13px; padding:12px 18px; font-size:15px; font-weight:700; width:100%;}
.btn:active{opacity:.85}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line); font-weight:600;}
.btn.slim{width:auto; padding:9px 14px; font-size:14px;}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
.btnrow{display:flex; gap:8px; margin-top:10px}
.btnrow .btn{flex:1}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:11px 12px; font-size:15px; font-family:inherit; margin:4px 0 10px;}
textarea{min-height:70px; resize:vertical}
label.f{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-top:6px;}
.seg{display:flex; gap:6px; margin:6px 0 10px}
.seg button{flex:1; background:var(--surface2); border:1px solid var(--line); color:var(--muted);
  border-radius:11px; padding:10px 4px; font-size:13px; font-weight:600;}
.seg button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 10px}
.chip{background:var(--surface2); border:1px solid var(--line); color:var(--muted); border-radius:99px;
  padding:7px 13px; font-size:13.5px; font-weight:600;}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.item{display:flex; align-items:flex-start; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none}
.item .grow{flex:1; min-width:0}
.badge{font-size:10px; font-weight:800; letter-spacing:.08em; padding:2px 7px; border-radius:6px; text-transform:uppercase;}
.b-build{background:var(--accent-soft); color:var(--build)}
.b-live{background:rgba(111,160,140,.15); color:var(--live)}
.b-rest{background:rgba(133,144,192,.15); color:var(--rest)}
.bar{display:flex; height:16px; border-radius:99px; overflow:hidden; background:var(--surface2); margin:8px 0;}
.bar div{height:100%}
.bar .sb{background:var(--build)} .bar .sl{background:var(--live)} .bar .sr{background:var(--rest)}
.legend{display:flex; gap:14px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.lg{display:flex; align-items:center; gap:5px}
.sw{width:9px; height:9px; border-radius:3px; display:inline-block}
.sw.b{background:var(--build)} .sw.l{background:var(--live)} .sw.r{background:var(--rest)}
.modal-wrap{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:none; align-items:flex-end;}
.modal-wrap.open{display:flex}
.sheet{background:var(--surface); width:100%; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  border-radius:20px 20px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .25s ease; max-width:560px; margin:0 auto;}
@keyframes up{from{transform:translateY(30px); opacity:.6} to{transform:none; opacity:1}}
.sheet-grip{width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px;}
.ck-q{margin:14px 0 4px; font-size:14.5px; font-weight:600;}
.ck-need{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-top:16px;}
nav.navbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--surface);
  border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
nav.navbar button{flex:1; background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; letter-spacing:.03em;}
nav.navbar button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none;}
nav.navbar button.on{color:var(--accent)}
.banner{background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent);
  border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:14px;}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:18px 8px;}
.linklike{background:none; border:none; color:var(--accent); font-size:14px; font-weight:600; padding:6px 0; text-decoration:underline;}
.qa q{display:block; font-size:12.5px; color:var(--muted); margin-top:8px; font-style:normal; quotes:none;}
.qa p{margin:2px 0 0; font-size:14.5px;}
.exp-stats{display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin:6px 0; flex-wrap:wrap}
.checkline{display:flex; align-items:center; gap:9px; padding:7px 0;}
.checkline input{width:auto; margin:0}
.done{text-decoration:line-through; color:var(--muted)}
[data-armed="1"]{color:var(--danger)!important; border-color:var(--danger)!important}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom));
  background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:99px;
  font-size:13.5px; z-index:99; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; max-width:86%; text-align:center;}
.toast.show{opacity:1}
@media (max-width:370px){.needs-grid{grid-template-columns:1fr}}
.timerbig{font-family:Georgia,serif;font-size:46px;letter-spacing:2px;text-align:center;margin:10px 0;font-weight:600}
.ideas{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow" id="hdrEyebrow">Compass</div>
    <h1 id="hdrTitle">My Life</h1>
  </div>
  <div class="hdr-actions">
    <button class="iconbtn" data-act="openBlueprint" title="My Blueprint">✦</button>
    <button class="iconbtn" data-act="openSettings" title="Settings">⚙</button>
  </div>
</header>

<main>
  <section id="screen-today" class="screen active"></section>
  <section id="screen-balance" class="screen"></section>
  <section id="screen-explore" class="screen"></section>
  <section id="screen-goals" class="screen"></section>
  <section id="screen-review" class="screen"></section>
</main>

<nav class="navbar">
  <button id="nav-today" class="on" data-act="nav" data-a1="today">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/></svg>Today</button>
  <button id="nav-balance" data-act="nav" data-a1="balance">
    <svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 19V11"/><path d="M12 19V6"/><path d="M18 19v-5"/></svg>Balance</button>
  <button id="nav-explore" data-act="nav" data-a1="explore">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-1.8 4.2L9 15l1.8-4.2z"/></svg>Explore</button>
  <button id="nav-goals" data-act="nav" data-a1="goals">
    <svg viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4h11l-2.5 3.5L17 11H6"/></svg>Goals</button>
  <button id="nav-review" data-act="nav" data-a1="review">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-7-4-7 4z"/></svg>Review</button>
</nav>

<div class="modal-wrap" id="modalWrap">
  <div class="sheet" id="modalSheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= CONSTANTS ================= */
var KEY='mylife_compass_v1';
var NEEDS=[
 {k:'phys',   name:'Physiological',      icon:'\uD83C\uDF43', q:'Am I taking care of my body?'},
 {k:'safety', name:'Safety',             icon:'\uD83D\uDEE1\uFE0F', q:'Am I creating a stable and secure future?'},
 {k:'belong', name:'Belonging',          icon:'\uD83D\uDC65', q:'Do I have meaningful human connection?'},
 {k:'esteem', name:'Esteem',             icon:'\uD83C\uDFD4\uFE0F', q:'Am I becoming someone I respect?'},
 {k:'selfact',name:'Self-actualization', icon:'\uD83E\uDDED', q:'Am I discovering what I could become?'},
 {k:'contrib',name:'Contribution',       icon:'\uD83E\uDD1D', q:'Am I contributing beyond myself?'}
];
var ALLK=['phys','safety','belong','esteem','selfact','contrib','rest'];
var NAMEOF={phys:'Physiological',safety:'Safety',belong:'Belonging',esteem:'Esteem',selfact:'Self-actualization',contrib:'Contribution',rest:'Rest'};
var ICONOF={phys:'\uD83C\uDF43',safety:'\uD83D\uDEE1\uFE0F',belong:'\uD83D\uDC65',esteem:'\uD83C\uDFD4\uFE0F',selfact:'\uD83E\uDDED',contrib:'\uD83E\uDD1D',rest:'\uD83C\uDF19'};
var CK_QS={
 phys:'Did I take reasonable care of my body today?',
 safety:'Did I make meaningful progress toward my responsibilities or future?',
 belong:'Did I have meaningful human interaction?',
 esteem:'Did I do something difficult, useful, or competence-building?',
 selfact:'Did I explore, create, learn, or pursue something because I genuinely wanted to?',
 contrib:'Did I help or contribute to someone or something beyond myself?',
 rest:'Did I get enough genuine recovery?'
};
var CK_OPTS=['Poor','Okay','Good','Excellent'];
var STATUS=['Neglected','Needs attention','Okay','Good','Strong'];
var EPIGRAPHS=[
 'Rest after living, rather than resting instead of living.',
 'Build your future. Live your present. Rest without guilt.',
 'You don\u2019t find a passion \u2014 you collect evidence until one finds you.',
 'A small real action beats a large imagined one.',
 'Comfort is a good servant and a poor master.',
 'What you do today is a vote for the person you\u2019re becoming.',
 'Direction matters more than speed.',
 'Attention is how you tell yourself what matters.',
 'Nothing needs to be perfect to be worth doing.',
 'A good life is built in ordinary days.'
];
var SUGGEST={
 phys:['Take a 30-minute walk outside.','Go to bed 45 minutes earlier tonight.','Cook one proper meal instead of grabbing something.'],
 safety:['Do one focused 45-minute study block on your hardest subject.','Spend 20 minutes organizing your week \u2014 deadlines, money, admin.','Review one lecture today instead of leaving it for exam season.'],
 belong:['Message someone you enjoy and propose a concrete plan this week.','Have one real conversation today \u2014 voice, not just texts.','Show up to one social activity this week.'],
 esteem:['Spend 25 minutes on the task you\u2019ve been avoiding \u2014 just start.','Practice a skill for 30 minutes and note one improvement.','Do one hard thing before any scrolling today.'],
 selfact:['Try something you\u2019re curious about for 45 minutes.','Start a small experiment in Explore \u2014 name it and book the first session.','Learn something today purely because it interests you.'],
 contrib:['Help one person with something concrete today.','Teach or explain something you know to someone who needs it.','Do one small useful thing for your family or community.'],
 rest:['Protect one hour of genuine, deliberate recovery tonight \u2014 without guilt.','Get a full night of sleep tonight; treat it as an appointment.','Take real rest today: chosen, not default.']
};
var ATT_LINE={
 phys:'Not much logged care for your body recently.',
 safety:'Little logged progress on responsibilities or your future this week.',
 belong:'You haven\u2019t logged much meaningful social contact recently.',
 esteem:'Few difficult or competence-building things logged lately.',
 selfact:'Mostly responsibilities and maintenance lately \u2014 little exploration logged.',
 contrib:'Nothing logged recently that reaches beyond yourself.',
 rest:'Your recovery looks thin this week.'
};
var OBS=['I enjoy doing it.','I enjoy getting better at it.','I\u2019m curious about it.','I enjoy the people involved.','I like the idea more than the activity.','I\u2019m not interested.','I want to try it differently.'];
var REVIEW_QS=['What went well?','What did I neglect?','What gave me energy?','What drained me?','What did I enjoy?','What did I avoid?','What did I learn about myself?','What do I want to experiment with next week?','Did I spend my free time mostly living, resting, or escaping?'];
var EXP_STATUSES=['Considering','Trying','Active','Abandoned','Revisit later'];
var EXP_ST_CLASS={'Considering':'st-2','Trying':'st-1','Active':'st-4','Abandoned':'st-2','Revisit later':'st-1'};
var IDEAS=['Photography','Boxing','Cooking a new cuisine','Learning Arabic','Guitar','Programming','Chess','Swimming','Volunteering at a clinic','Sketching','Running','Writing short stories','Calisthenics','A podcast on a new topic','Football with friends','Video editing','Public speaking','Gardening','Investing basics','Table tennis','Learning French','3D printing','Hiking','Baking bread','Teaching a junior student','Board game nights','Meditation','Bouldering','Blogging about medicine','First-aid instructing'];
var NEED_MODE={phys:'build',safety:'build',esteem:'build',belong:'live',selfact:'live',contrib:'live',rest:'rest'};
var GOAL_PLACEHOLDER={phys:'e.g. Become physically fit',safety:'e.g. Graduate and become financially independent',belong:'e.g. Develop a strong circle of friends',esteem:'e.g. Become confident and competent',selfact:'e.g. Discover interests worth pursuing',contrib:'e.g. Find ways to meaningfully help others'};

/* ================= STORAGE ================= */
var DB, memOnly=false;
function defaultDB(){return {v:1,settings:{theme:'dark'},checkins:{},activities:[],experiments:[],goals:[],reviews:[],intention:null,timer:null};}
function loadDB(){
  try{var r=localStorage.getItem(KEY); DB=r?JSON.parse(r):defaultDB();}
  catch(e){DB=defaultDB(); memOnly=true;}
  var d=defaultDB();
  for(var p in d){ if(DB[p]===undefined) DB[p]=d[p]; }
}
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){memOnly=true;} }

/* ================= HELPERS ================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).length<2?'0'+n:String(n);}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dstr(new Date());}
function lastNDates(n){var a=[],d=new Date(); for(var i=n-1;i>=0;i--){var t=new Date(d); t.setDate(d.getDate()-i); a.push(dstr(t));} return a;}
function fmtDay(ds){try{return new Date(ds+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}catch(e){return ds;}}
function fmtLong(d){try{return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return dstr(d);}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function doy(){var n=new Date(); return Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);}
function fm(min){min=Math.round(min); if(min<60)return min+'m'; var h=Math.floor(min/60),m=min%60; return h+'h'+(m?' '+m+'m':'');}
function mmss(ms){ms=Math.max(0,ms);var t=Math.round(ms/1000),m=Math.floor(t/60),x=t%60;return m+':'+(x<10?'0':'')+x;}
var toastTimer=null;
function toast(msg){
  var t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2300);
}
/* two-tap confirmation for destructive actions (works where confirm() is blocked) */
function armed(el,label){
  if(el.getAttribute('data-armed')==='1'){el.removeAttribute('data-armed'); return true;}
  el.setAttribute('data-armed','1');
  var old=el.textContent; el.textContent=label||'Tap again to confirm';
  setTimeout(function(){ if(el&&el.getAttribute('data-armed')==='1'){el.removeAttribute('data-armed'); el.textContent=old;} },3500);
  return false;
}

/* ================= SCORING ================= */
function needScore(k){
  var days=lastNDates(7), s=0, i;
  for(i=0;i<days.length;i++){var c=DB.checkins[days[i]]; if(c&&typeof c[k]==='number') s+=c[k];}
  var acts=0;
  for(i=0;i<DB.activities.length;i++){var a=DB.activities[i];
    if(days.indexOf(a.date)>=0){
      if(k==='rest'){ if(a.mode==='rest') acts++; }
      else if(a.needs&&a.needs.indexOf(k)>=0) acts++;
    }
  }
  s+=Math.min(acts*2,8);
  return s;
}
function statusIdx(s){return s<2?0:s<6?1:s<11?2:s<16?3:4;}
function hasAnyData(){
  return Object.keys(DB.checkins).length>0||DB.activities.length>0||DB.experiments.length>0||DB.goals.length>0||DB.reviews.length>0;
}
function ensureIntention(){ if(DB.intention&&DB.intention.date!==today()){DB.intention=null; persist();} }

/* ================= ONE THING ================= */
var sugShift=0;
function pickSuggestion(){
  var best=null,bestScore=1e9;
  for(var i=0;i<ALLK.length;i++){var k=ALLK[i],s=needScore(k); if(s<bestScore){bestScore=s;best=k;}}
  var bank=SUGGEST[best];
  return {k:best,text:bank[(doy()+sugShift)%bank.length]};
}
function acceptIntention(){var s=pickSuggestion(); DB.intention={date:today(),text:s.text,need:s.k,done:false,dismissed:false}; persist(); renderAll();}
function anotherSuggestion(){sugShift++; renderToday();}
function dismissIntention(){DB.intention={date:today(),dismissed:true}; persist(); renderToday();}
function newIntention(){DB.intention=null; sugShift++; persist(); renderToday();}
function toggleIntentionDone(){ if(DB.intention){DB.intention.done=!DB.intention.done; persist(); renderToday();} }

/* ================= NAVIGATION ================= */
var SCREENS=['today','balance','explore','goals','review'];
var HDR={today:['Compass','My Life'],balance:['Build \u00b7 Live \u00b7 Rest','Balance'],explore:['Experiments','Explore'],goals:['Direction','Goals'],review:['Reflection','Review']};
function go(name){
  for(var i=0;i<SCREENS.length;i++){
    var s=SCREENS[i];
    $('screen-'+s).classList.toggle('active',s===name);
    $('nav-'+s).classList.toggle('on',s===name);
  }

/* ================= BALANCE ================= */
function calcModes(nDays){
  var days=lastNDates(nDays), t={build:0,live:0,rest:0}, count=0;
  for(var i=0;i<DB.activities.length;i++){
    var a=DB.activities[i];
    if(days.indexOf(a.date)>=0){ t[a.mode]+=(a.duration||45); count++; }
  }
  t.total=t.build+t.live+t.rest; t.count=count;
  return t;
}
function barBlock(title,t){
  var h='<div class="card"><h3 class="serif">'+title+'</h3>';
  if(!t.total){ h+='<div class="empty">Nothing logged for this period yet.</div></div>'; return h; }
  var pb=Math.round(t.build/t.total*100), pl=Math.round(t.live/t.total*100), pr=100-pb-pl;
  h+='<div class="bar"><div class="sb" style="width:'+pb+'%"></div><div class="sl" style="width:'+pl+'%"></div><div class="sr" style="width:'+pr+'%"></div></div>'
    +'<div class="legend"><span class="lg"><span class="sw b"></span>Build '+pb+'% \u00b7 '+fm(t.build)+'</span>'
    +'<span class="lg"><span class="sw l"></span>Live '+pl+'% \u00b7 '+fm(t.live)+'</span>'
    +'<span class="lg"><span class="sw r"></span>Rest '+pr+'% \u00b7 '+fm(t.rest)+'</span></div></div>';
  return h;
}
function renderBalance(){
  var h='<p class="epigraph">There is no single correct ratio. This page only shows your pattern.</p>';
  h+=barBlock('Today',calcModes(1));
  var w=calcModes(7);
  h+=barBlock('Last 7 days',w);
  h+=barBlock('Last 30 days',calcModes(30));
  var lines=[];
  if(!w.total){
    lines.push('No activities logged in the last 7 days yet. Log a few and observations will appear here.');
  }else{
    var pb=w.build/w.total*100, pl=w.live/w.total*100, pr=w.rest/w.total*100;
    if(pb>=55&&pl<20) lines.push('A lot of BUILD and relatively little LIVE this week. Consider one thing done purely for enjoyment.');
    if(pl>=55&&pb<15) lines.push('A rich week for living. Keep an eye on longer-term responsibilities.');
    if(pr>=60) lines.push('A lot of REST recently. If it felt like recovery, good. If it felt like escape, that\u2019s worth noticing \u2014 not judging.');
    if(pr<10&&pb>=45) lines.push('A demanding week with little logged rest. Recovery is part of the work.');
    if(!lines.length) lines.push('Your week looks reasonably balanced across building, living and resting.');
  }
  var days=lastNDates(7), rec=0, escp=0;
  for(var i=0;i<DB.activities.length;i++){var a=DB.activities[i];
    if(days.indexOf(a.date)>=0&&a.mode==='rest'){ if(a.restFeel==='recovery')rec++; if(a.restFeel==='escape')escp++; }
  }
  if(rec+escp>0) lines.push('Of your labelled rest this week: '+rec+' felt like deliberate recovery, '+escp+' like escape.');
  var rsum=0,rcnt=0;
  for(var d=0;d<days.length;d++){var c=DB.checkins[days[d]]; if(c&&typeof c.rest==='number'){rsum+=c.rest;rcnt++;}}
  if(rcnt>=3&&rsum/rcnt<1) lines.push('Your check-ins suggest recovery has felt thin lately.');
  h+='<div class="card"><div class="eyebrow">Noticing</div>';
  for(var l=0;l<lines.length;l++) h+='<p class="small" style="margin:8px 0 0">'+lines[l]+'</p>';
  h+='</div>';
  $('screen-balance').innerHTML=h;
}

function recentDistinct(n){
  var out=[],seen={},list=DB.activities.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  for(var i=0;i<list.length&&out.length<n;i++){
    var k=list[i].name.toLowerCase().trim();
    if(!seen[k]){seen[k]=1;out.push(list[i]);}
  }
  return out;
}
function quickLog(id){
  var src=null;
  for(var i=0;i<DB.activities.length;i++) if(DB.activities[i].id===id) src=DB.activities[i];
  if(!src) return;
  DB.activities.push({id:uid(),name:src.name,date:today(),duration:src.duration,mode:src.mode,needs:(src.needs||[]).slice(),notes:'',restFeel:null});
  persist(); renderAll(); toast('Logged: '+src.name);
}
var ideaShift=0;
function pickIdeas(n){
  var used={},out=[];
  for(var i=0;i<DB.experiments.length;i++) used[DB.experiments[i].name.toLowerCase().trim()]=1;
  var pool=[];
  for(var p=0;p<IDEAS.length;p++) if(!used[IDEAS[p].toLowerCase()]) pool.push(IDEAS[p]);
  for(var j=0;j<n&&pool.length;j++) out.push(pool[(doy()+ideaShift*3+j)%pool.length]);
  return out;
}
function adoptIdea(name){ openExpForm(null); var f=$('efName'); if(f) f.value=name; var w=$('efWhy'); if(w) w.focus(); }

function nativeNotify(t){
  try{
    var LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
    if(!LN) return;
    if(LN.requestPermissions) LN.requestPermissions();
    LN.schedule({notifications:[{id:1001,title:'Time\u2019s up',body:t.label,schedule:{at:new Date(t.end),allowWhileIdle:true}}]});
  }catch(e){}
}
function nativeCancel(){
  try{
    var LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
    if(LN) LN.cancel({notifications:[{id:1001}]});
  }catch(e){}
}
function startTimer(mins){
  if(!DB.intention||DB.intention.dismissed) return;
  DB.timer={start:Date.now(),end:Date.now()+mins*60000,dur:mins,label:DB.intention.text,need:DB.intention.need||null};
  nativeNotify(DB.timer);
  persist(); renderToday(); toast(mins+' minutes \u2014 go');
}
function finishTimer(){
  var t=DB.timer; if(!t) return;
  var elapsed=Math.max(1,Math.round((Math.min(Date.now(),t.end)-t.start)/60000));
  var nd=t.need&&t.need!=='rest'?[t.need]:[];
  DB.activities.push({id:uid(),name:t.label.slice(0,60),date:today(),duration:elapsed,
    mode:NEED_MODE[t.need]||'build',needs:nd,notes:'',restFeel:null});
  if(DB.intention&&DB.intention.text===t.label) DB.intention.done=true;
  nativeCancel(); DB.timer=null;
  persist(); renderAll(); toast('Logged '+elapsed+'m \u2014 promise kept');
}
function dismissTimer(){ nativeCancel(); DB.timer=null; persist(); renderToday(); }
setInterval(function(){
  if(!DB||!DB.timer) return;
  var rem=DB.timer.end-Date.now(), el=$('timerRemain');
  if(rem>0){ if(el) el.textContent=mmss(rem); }
  else if(el){ renderToday(); }
},1000);

/* ================= EVENT DELEGATION =================
   No inline handlers anywhere: works under strict CSP,
   sandboxed previews, and Android WebView alike. */
function findAct(t,attr){
  if(t&&t.closest) return t.closest('['+attr+']');
  while(t&&t.getAttribute){ if(t.getAttribute(attr)) return t; t=t.parentNode; }
  return null;
}
function a1(el){return el.getAttribute('data-a1');}
function a2(el){return el.getAttribute('data-a2');}
var ACT={
  nav:function(el){go(a1(el));},
  openBlueprint:openBlueprint, openSettings:openSettings, closeModal:closeModal,
  openCheckin:openCheckin, saveCheckin:saveCheckin,
  ckSet:function(el){ckSet(a1(el),+a2(el));},
